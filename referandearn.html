    function RemoveInlineStyles(html) {
    // Create a temporary container
    let element = document.createElement('div');
    element.innerHTML = html;
    
    // Select all elements with a style attribute
    let elementsWithStyle = element.querySelectorAll('[style]');
    
    // Remove the 'style' attribute from each element
    elementsWithStyle.forEach(el => el.removeAttribute('style'));
    
    return element.innerHTML;
}

// Usage example:
let cleaned = RemoveInlineStyles(
