<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Registration Form Using Bootstrap 4</title>

   <!-- Bootstrap -->
   <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

   <!-- Hide dropdown arrow (Bootstrap-friendly, no override break) -->
   <!-- <style>
      /* Remove Bootstrap select dropdown arrow safely */

          -webkit-appearance: none !important;
          -moz-appearance: none !important;
          appearance: none !important;
          background-image: none !important;
      }

</head>
<body>

<div class="container mt-4 mb-5">
    <form>
        <h2 class="text-center mb-4">Join Our Network</h2>

        <div class="row jumbotron">

            <!-- First Name -->
            <div class="col-sm-6 form-group">
                <label>First Name</label>
                <input type="text" class="form-control" placeholder="Enter first name" required>
            </div>

            <!-- Last Name -->
            <div class="col-sm-6 form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" placeholder="Enter last name" required>
            </div>

            <!-- Email -->
            <div class="col-sm-6 form-group">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <!-- Address Line 1 -->
            <div class="col-sm-6 form-group">
                <label>Address Line 1</label>
                <input type="text" class="form-control" placeholder="House / Street">
            </div>

            <!-- Address Line 2 -->
            <div class="col-sm-6 form-group">
                <label>Address Line 2</label>
                <input type="text" class="form-control" placeholder="Area / City">
            </div>

            <!-- State -->
            <div class="col-sm-4 form-group">
                <label>State</label>
                <input type="text" class="form-control" placeholder="State name">
            </div>

            <!-- Postal -->
            <div class="col-sm-2 form-group">
                <label>Postal Code</label>
                <input type="text" class="form-control" placeholder="Zip">
            </div>

            <!-- Country -->
            <div class="col-sm-6 form-group select-wrapper">
                <label>Country</label>
                <select class="form-control">
                    <option>India</option>
                    <option>United States</option>
                    <option>United Kingdom</option>
                    <option>Canada</option>
                    <option>Australia</option>
                </select>
            </div>

            <!-- DOB -->
            <div class="col-sm-6 form-group">
                <label>Date of Birth</label>
                <input type="date" class="form-control">
            </div>

            <!-- Gender -->
            <div class="col-sm-6 form-group select-wrapper">
                <label>Gender</label>
                <select class="form-control">
                    <option>Male</option>
                    <option>Female</option>
                    <option>Unspecified</option>
                </select>
            </div>

            <!-- Country Code -->
            <div class="col-sm-2 form-group select-wrapper">
                <label>Country Code</label>
                <select class="form-control">
                    <option value="1">USA (+1)</option>
                    <option value="44">UK (+44)</option>
                    <option value="91">India (+91)</option>
                    <option value="61">Australia (+61)</option>
                </select>
            </div>

        </div>
    </form>
</div>>


</body>
</html>
