<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        @font-face {
            font-family: 'TCF-Noli';
            src: url('./fonts/tcf-noli-black-maisfontes.80c5/tcf-noli-black.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .content-section {
            /* height: 200vh; */
            background: linear-gradient(180deg, #000 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-section h1 {
            color: white;
            font-size: 3rem;
        }

        .hero-section {
            /* min-height: 100vh; */
            position: relative;
            overflow: hidden;

        }

        .moving-object-1 {
            left: 0%;
            position: absolute;
            transform: translateY(-50%);
            top: 23%;
            will-change: transform;
            z-index: 3;
        }

        .moving-object-2 {
            right: 0px;
            position: absolute;
            top: 43%;
            transform: translateY(-50%);
            will-change: transform;
            z-index: 2;
        }

        /* .moving-object-1 img, */
        .moving-object-2 img {
            width: 100%;
        }

        .moving-object-1 img {
            width: 80%;
        }

        .moving-object-1,
        .moving-object-2 {
            transition: transform 0.2s ease-out;
        }

        .hero-section .hero-overlay {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            padding: 40px 0;
        }

        .hero-section .hero-overlay .row {
            min-height: calc(100vh - 80px);
        }

        .hero-section .left-visual {
            position: relative;
            min-height: 70vh;
        }

        .hero-section .right-text {
            color: #fff;
            display: flex;
            align-items: center;
            min-height: 70vh;
            font-size: 18px;
            line-height: 1.7;
        }

        header {
            background-color: #f1f1f1;
            padding: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .moving-object-1 {
                left: 50px;
                transform: translateY(-50%) !important;
            }

            .moving-object-2 {
                right: 50px;
                transform: translateY(-50%) !important;
            }
        }

        .section-1 {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .section-1 video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .section-1 .overlay-content {
            position: relative;
            z-index: 2;
            /* min-height: 100vh; */
        }

        .section-1 .overlay-content .row {
            min-height: 100vh;

        }

        .section-1 .right-panel {
            /* min-height: 100vh; */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0px 20px 40px 20px;
        }

        .section-1 .right-panel .logo-img {
            max-width: 100%;
            height: auto;
            margin-left: auto;
        }

        .section-1 .store-icons img {
            width: 200px;
            max-width: 100%;
            margin-right: 20px;
            /* padding: 20px; */
        }


        .bottom-goalpost-div{
            height: 250px;
            width:100vw;
            /* background: #370C8A;
            background:url('/cg-gamezone/client/public/images/banger/bg-repeat.png'),linear-gradient(90deg,rgba(55, 12, 138, 1) 0%,rgba(57, 14, 138, 1) 4%,rgba(91, 40, 177, 1) 100%); */
            /* background-repeat: repeat-x; */
            position: relative;
            margin-top: -184px;
            z-index: 4;
        }

        .bottom-goalpost-bg {
            position: absolute;
            inset: 0;
            background:url('/cg-gamezone/client/public/images/banger/bg-repeat.png'),linear-gradient(90deg, rgba(55, 12, 138, 1) 0%,    rgba(57, 14, 138, 1) 4%,    rgba(91, 40, 177, 1) 100%);
            background-repeat:repeat-x,no-repeat;
            background-position:top center,center;
            clip-path: polygon(0 0, 100% 0, 100% 59%, 0% 84%);
            z-index: 1;
        }

        .bottom-goalpost-div .arc-img {
            position: absolute;
            top: -116px;
            right: 84px;
            width: clamp(130px, 14vw, 220px);
            height: auto;
            z-index: 5;
        }
        .hero-section .bottom-goalpost-div p {
            position: relative;
            float: right;
            font-family:'TCF-Noli', sans-serif;
            color:#FFF;
            width: 860px;
            right: 97px;
            margin: 0;
            font-size: 30px;
            text-shadow: 1px 0 #D80D43;
            overflow-wrap: break-word;
            top: 24px;
            text-align: left;
            z-index: 3;
        }
        .hero-bg {
            width: 100%;
            display: block;
            position: relative;
            z-index: 1;
            margin-top: -190px;
        }

        .feature-section-1 {
            position: relative;
            /* margin: -30px 0; */
            /* padding: 70px 0; */
            overflow: hidden;
            z-index: 3;
            margin-top: -103px;
        }

        .feature-clip-a {
            clip-path: polygon(0 10%, 100% 0%, 100% 100%, 0 90%);
            background: #600202;
            background: linear-gradient(90deg, rgba(96, 2, 2, 1) 0%, rgba(163, 1, 1, 1) 35%, rgba(218, 0, 0, 1) 68%);
        }

        .feature-section-1 .feature-row {
            display: flex;
            align-items: center;
        }

        .feature-text {
            color: #fff;
            padding: 15px 20px;
        }

        .feature-text h4 {
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .feature-text h5 {
            font-size: 32px;
            margin: 0 0 14px;
        }

        .feature-text h6 {
            font-size: 18px;
            line-height: 1.6;
            font-weight: 400;
        }

        .feature-image-wrap {
            padding: 10px 20px;
        }

        .feature-image-wrap img {
            width: 100%;
            max-width: 860px;
            height: auto;
            display: block;
        }

        .reveal {
            opacity: 0;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal-left {
            transform: translateX(-55px);
        }

        .reveal-right {
            transform: translateX(55px);
        }

        .reveal.in-view {
            opacity: 1;
            transform: translateX(0);
        }

        
        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }


        .cta-title {
            color: #fff;
            text-shadow: 3px 0 #D3184E;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
        }

        .cta-subtitle {
            color: #e0e0e0;
            font-size: 18px;

            margin-left: auto;
            margin-right: auto;
            font-family: 'TCF-Noli', sans-serif;
            letter-spacing: 1px;
            text-align: center;
        }
       
    </style>
</head>

<body>

    <script>


        // moving script.
        const object1 = document.querySelector('.moving-object-1');
        const object2 = document.querySelector('.moving-object-2');
        const heroSection = document.querySelector('.hero-section');
        // const MAX_MOVE = 250; // 👈 stopping point

        function handleScroll() {
            // Disable movement on mobile
            if (window.innerWidth <= 768) {
                object1.style.transform = 'translateY(-50%)';
                object2.style.transform = 'translateY(-50%)';
                return;
            }

            const rect = heroSection.getBoundingClientRect();
            const windowHeight = window.innerHeight;

            // Run only when hero section is visible
            if (rect.top < windowHeight && rect.bottom > 0) {

                // Convert section position to progress (0 → 1)
                let progress = (windowHeight - rect.top) / (windowHeight + rect.height);

                // Clamp (prevent overflow)
                progress = Math.max(0, Math.min(1, progress));

                // Control speed here
                // const moveX = progress * 600;

                //  STOP at limit
                // moveX = Math.min(moveX, MAX_MOVE);
                let moveX = Math.min(progress * 600, 234);

                // Apply movement
                object1.style.transform = `translate(${moveX}px, -50%)`;
                object2.style.transform = `translate(-${moveX}px, -50%)`;
            }
        }

        // Listen scroll
        window.addEventListener('scroll', handleScroll);

        handleScroll();

    </script>
