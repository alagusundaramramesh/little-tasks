<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA GALLERY Fix</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        @font-face {
            font-family: 'TCF-Noli';
            src: url('./fonts/tcf-noli-black-maisfontes.80c5/tcf-noli-black.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .slider-container {
            width: 100%;
            height: 100vh;
        }

        .slider-container .slick-list,
        .slider-container .slick-track,
        .slider-container .slick-slide,
        .slider-container .slick-slide>div {
            height: 100%;
        }

        .feature-clip-slider {
            clip-path: polygon(0% 0%, 100% 0%, 100% 99.9%, 0% 87%);
            background: #600202;
            /* background: linear-gradient(90deg, rgba(96, 2, 2, 1) 0%, rgba(163, 1, 1, 1) 35%, rgba(218, 0, 0, 1) 68%); */
        }

        .slider-container img {
            transform: scale(1.1);
        }

        .slider-container .slide {
            position: relative;
            overflow: hidden;
        }

        .slider-container .slide::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            pointer-events: none;
            z-index: 2;
        }

        .slider-container .slide img {
            position: relative;
            z-index: 1;
        }

        .slider-container .slick-prev,
        .slider-container .slick-next {
            z-index: 20;
            width: 42px;
            height: 42px;
        }

        .slider-container .slick-prev {
            left: 20px;
        }

        .slider-container .slick-next {
            right: 20px;
        }

        .slider-container .slick-prev:before,
        .slider-container .slick-next:before {
            color: #fff;
            font-size: 42px;
            opacity: 1;
        }

        .slider-container .slick-dots {
            bottom: 70px;
            z-index: 20;
        }

        .slider-container .slick-dots li button:before {
            color: #fff;
            opacity: 0.55;
            font-size: 11px;
        }

        .slider-container .slick-dots li.slick-active button:before {
            opacity: 1;
        }
    </style>
</head>

<body>


    <!-- Section 4 -->
    <section class="">
        <p
            style="font-family:'TCF-Noli', sans-serif; float: left; font-size: 80px; top:5px; position:absolute; color:#fff; -webkit-text-stroke: 0.5px #B294e3; z-index: 1;">
            &nbsp;&nbsp;&nbsp;MAP GALLERY </p>
        <div class="slider-container feature-clip-slider">
            <div class="slide">
                <img src="/cg-gamezone/client/public/images/banger/1.jpg" />
            </div>
            <div class="slide">
                <img src="/cg-gamezone/client/public/images/banger/2.jpg" />
            </div>
            <div class="slide" >
                <img src = "/cg-gamezone/client/public/images/banger/3.jpg"/>
            </div>
            <div class="slide" >
                <img src = "/cg-gamezone/client/public/images/banger/4.jpg"/>
            </div>
            <div class="slide" >
                <img src = "/cg-gamezone/client/public/images/banger/5.jpg"/>
            </div>
            <div class="slide">
                <img src="/cg-gamezone/client/public/images/banger/6.jpg" />
            </div>
            <div class="slide">
                <img src="/cg-gamezone/client/public/images/banger/7.jpg" />
            </div>
            <div class="slide">
                <img src="/cg-gamezone/client/public/images/banger/8.jpg" />
            </div>
            
        </div>
    </section>



    <script>
        $(document).ready(function () {
            $('.slider-container').slick({
                dots: true,
                arrows: true,
                speed: 300,
                fade: true,
                cssEase: 'linear',
                autoplay: true,
                autoplaySpeed: 2300
            });
        }
        );

    </script>

</body>

</html>
