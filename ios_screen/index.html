<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Fullscreen Landscape</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #iframe-div {
      display: none;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      background: #000;
    }

    #game_frame {
      width: 100%;
      height: 100%;
      border: none;
      /* display: none; */
    }

    #img_frame {
      width: 100%;
      height: auto;
    }

    .fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 9999;
      background: #000;
    }

    #start-btn {
      position: absolute;
      z-index: 10000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #00b7ff;
      color: #fff;
      font-size: 1.2rem;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .float_button_visibility {
      display: flex !important;
      visibility: visible !important;
      z-index: 9999 !important;
      pointer-events: auto !important;
      opacity: 1 !important;
    }

    .fullscreen_manager {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 9999 !important;
      background: #000 !important;
      overflow: hidden !important;
    }

    ;
  </style>
  <script src="class.fullscreen_manager.js"></script>
</head>
