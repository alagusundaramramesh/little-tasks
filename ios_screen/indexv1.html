<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Fullscreen Landscape</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #iframe-div {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      background: #000;
    }

    #game_frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    #img_frame {
      width: 100%;
      height: auto;
    }

    .fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 9999;
      background: #000;
    }

    #start-btn {
      position: absolute;
      z-index: 10000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #00b7ff;
      color: #fff;
      font-size: 1.2rem;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="iframe-div">
    <img id="img_frame" src="/POC/ios_screen/mr_racer.jpg" alt="Game Preview">
    <iframe id="game_frame" src="/POC/ios_screen/5_none_v7/index.html" allow="fullscreen; autoplay; accelerometer; gyroscope"></iframe>
    <button id="start-btn">Start Game</button>
  </div>

  <script>
    function isIOS() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua)) return "iOS";
      if (/android/i.test(ua)) return "Android";
      return "PC";
    }

    async function lockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock("landscape");
          console.log("🔒 Locked to landscape");
        } catch (err) {
          console.warn("Orientation lock failed:", err);
        }
      }
    }

    async function enterFullscreen(elem) {
      if (elem.requestFullscreen) {
        await elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        await elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        await elem.msRequestFullscreen();
      }
    }

    async function startGame() {
      const iframeDiv = document.getElementById("iframe-div");
      const gameFrame = document.getElementById("game_frame");
      const imgFrame = document.getElementById("img_frame");
      const startBtn = document.getElementById("start-btn");

      startBtn.style.display = "none";
      imgFrame.style.display = "none";
      gameFrame.style.display = "block";
      iframeDiv.classList.add("fullscreen");

      await enterFullscreen(document.documentElement);
      await lockLandscape();

      // Adjust screen size for iOS safe area
      window.scrollTo(0, 0);
      document.body.style.height = window.innerHeight + "px";
    }

    window.addEventListener("load", () => {
      const startBtn = document.getElementById("start-btn");
      startBtn.addEventListener("click", startGame);
    });
  </script>
</body>
</html>
