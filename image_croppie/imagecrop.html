<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CropperJS Simple Example</title>

  <!-- CropperJS CSS -->
  <link href="croppie.css" rel="stylesheet">
  <!-- CropperJS JS -->
  <script src="croppie.js"></script>
  <script src="croppie.min.js"></script>

  <style>
    #preview {
      width: 300px;
      height: 300px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    #cropped-result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h3>CropperJS Demo</h3>

<input type="file" id="fileInput" accept="image/*">

<br><br>

<div>
  <img id="preview" style="display:none;">
</div>

<button id="cropBtn" style="margin-top:10px; display:none;">Crop Image</button>

<div id="cropped-result"></div>



<script>
  let cropper = null;

  document.getElementById('fileInput').addEventListener('change', function (e) {
      let file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
          let image = document.getElementById('preview');
          image.src = e.target.result;
          image.style.display = "block";

          // Destroy existing cropper if exists
          if (cropper) {
              cropper.destroy();
          }

          // Initialize Croppie
          cropper = new Croppie(image, {
              boundary: { width: 500, height: 300 },
              viewport: { width: 200, height: 200, type: 'circle' },
              enableExif: true,
              showZoomer: true,
              mouseWheelZoom: 'ctrl'
          });

          cropper.bind({
              url: e.target.result,
              orientation: 1

          })

          document.getElementById('cropBtn').style.display = "inline-block";
      }
      reader.readAsDataURL(file);
  });


  // When "Crop" button clicked
  document.getElementById('cropBtn').addEventListener('click', function () {
      if (!cropper) return;
      document.getElementById('preview').style.display = "none";
      cropper.result({
          type: 'base64',
          size: 'viewport',
          size: { width: 200, height: 200 },
          format: 'png',
          circle:false,
          quality:1
      }).then(function (cropper) {
          console.log(" Cropped Image Base64: ", cropper);
          // output_url = cropper;
          document.getElementById('cropped-result').innerHTML =
          `<h4>Cropped Output:</h4><img src="${cropper}" style="max-width:300px; border-radius:50%;">` +
          `<a href="${cropper}" download="cropped_image.png">Download Cropped Image</a>`;
          setTimeout(()=>{
            document.getElementsByTagName('a')[0].click();
          })
      });
      

      
  });
</script>

</body>
</html>
