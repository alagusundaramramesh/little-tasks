<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup with image upload </title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<!-- CropperJS CSS -->
<link href="croppie.css" rel="stylesheet">
<!-- CropperJS JS -->
<script src="croppie.js"></script>
<!-- <script src="croppie.min.js"></script> -->
<style>
    #preview {
        width: 200px;
        height: 200px;
        border: 1px solid #ccc;
        margin-top: 10px;
    }

    #cropped-result {
        margin-top: 20px;
    }
    .toggle-btn {
    width: 100%;
    padding: 10px 15px;
    background: #ff810e;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    transition: background 0.3s;
    }
    .toggle-btn.active {
    background: #ff810e;   /* darker orange */
}

.toggle-btn:not(.active) {
    background: #303234;   /* grey when inactive */
}
</style>

<body>
    <div class="modal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
            <div class="modal-content">

                <div class="modal-header" style="display:block">
                    <div class="contianer">
                        <div class="row">
                            <div class="col-5">
                                <button type="button" class="toggle-btn active" id="image-upload-btn" data-bs-toggle="button" autocomplete="off" aria-pressed="true">Image
                                    Upload</button>
                            </div>
                            <div class="col-5">
                                <button type="button" class="toggle-btn" id="preset-upload-btn" data-bs-toggle="button" autocomplete="off">Preset
                                    Upload</button>
                            </div>
                            <div class="col-2">
                                <button type="button" class=" btn btn-danger close" data-dismiss="modal"
                                    aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-body">
                    <div id="image-upload"
                        style="border: 2px dashed #ff810e; padding: 20px; text-align: center; cursor: pointer;">
                        <h4>UPLOAD YOUR IMAGE HERE</h4>
                        <p>Supported format: jpg, Png, webp</p>
                        <div class="mb-3" style="text-align:center; display: block;">
                            <input type="file" class="form-control " id="fileInput" accept="image/*"
                                style="display: inline-block; width: min-content;"><br>
                            <img id="preview" src="https://picsum.photos/200/200?grayscale" style="display:inline-block; margin-top: 12px; border-radius: 50%;"
                                width="100%" />
                        </div>
                    </div>

                    <div id="preset-upload" style="display:none; overflow: auto;">
                        <h4>PRESET UPLOAD SECTION</h4>
                        <!-- <button type="button" class="btn btn-secondary" onclick="PresetUploadBtn()">Preset Upload
                                Click</button> -->

                        <div id="upload-preset-images"></div>

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="cropBtn" style="display: none;">Crop</button>
                    <button id="edit-button" class="btn btn-warning" style="margin-top:10px; display:none;">Edit
                        Image</button>
                    <button id="save-button" class="btn btn-success" style="margin-top:10px; display:none;"
                        onclick="saveData()">Save</button>

                    <!-- <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button> -->
                    <!-- <p>Choose your Image</p> -->
                </div>
            </div>
</body>
<script>
    let cropper = null;
    var myModal = new bootstrap.Modal(document.querySelector('.modal'), {
        keyboard: false
    })
    myModal.show();

    function closeModal() {
        document.getElementsByClassName('modal')[0].style.display = "none";
    }
    document.getElementById('fileInput').addEventListener('change', function (e) {
        Fileuploaded(e);
    });
    document.querySelector('.close').addEventListener('click', closeModal);

    document.getElementById('cropBtn').addEventListener('click', function () {
        CropedImage();
    });

    function CropedImage(params) {
        // alert("Clicked");
        if (!cropper) return;
        document.getElementById('preview').style.display = "inline-block";
        cropper.result({
            type: 'blob',
            size: 'viewport',
            size: { width: 200, height: 200 },
            format: 'png',
            circle: false,
            quality: 1
        }).then(function (croppedBlob) {
            // console.log(" Cropped Image Base64: ", cropper);
            document.getElementById('preview').src = URL.createObjectURL(croppedBlob);
            document.getElementById('preview').style.borderRadius = "50%";
            document.getElementsByClassName('cr-boundary')[0].style.display = "none";
            document.getElementsByClassName('cr-slider-wrap')[0].style.display = "none";
            document.getElementById('edit-button').style.display = "inline-block";
            document.getElementById('cropBtn').style.display = "none";
            document.getElementById('fileInput').style.display = "none";
            document.getElementById('edit-button').addEventListener('click', function () {
                document.getElementById('fileInput').style.display = "inline-block";
                document.getElementsByClassName('cr-boundary')[0].style.display = "block";
                document.getElementsByClassName('cr-slider-wrap')[0].style.display = "block";
                document.getElementById('edit-button').style.display = "none";
                document.getElementById('cropBtn').style.display = "inline-block";
                document.getElementById('preview').style.display = "none";
                document.getElementById('save-button').style.display = "none";
            });
            document.getElementById('save-button').style.display = "inline-block";
        });
    }


    function Fileuploaded(e) {
        let file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            let image = document.getElementById('preview');
            image.src = e.target.result;
            image.style.display = "none";

            // Destroy existing cropper if exists
            if (cropper) {
                cropper.destroy();
            }

            // Initialize Croppie
            cropper = new Croppie(image, {
                boundary: { width: "100%", height: 300 },
                viewport: { width: 200, height: 200, type: 'circle' },
                enableExif: true,
                showZoomer: true,
                mouseWheelZoom: 'ctrl',
                enforceBoundary: true,
            });

            cropper.bind({
                url: e.target.result,
                orientation: 1

            });
            document.getElementsByClassName('cr-boundary')[0].style.marginTop = "12px";
            document.getElementById('cropBtn').style.display = "inline-block";

        }
        reader.readAsDataURL(file);
    }

    function saveData() {
        // console.log(data);
        alert("Save");
        closeModal();
    }

    function PresetUploadBtn(params) {
        // alert("Preset Upload Clicked");
        document.getElementById('image-upload-btn').classList.remove('active');
        document.getElementById('image-upload-btn').setAttribute('aria-pressed', 'false');
        document.getElementById('image-upload').style.display = "none";
        document.getElementById('preset-upload').style.display = "block";
        document.getElementById('preset-upload-btn').classList.add('active');
        document.getElementById('preset-upload-btn').setAttribute('aria-pressed', 'true');
        for (let index = 0; index < 18; index++) {
            // const element = array[index];
            document.getElementById('upload-preset-images').innerHTML += `
                <div key="${index}" style="text-align: center; display: inline-block;
                        margin: 10px; border: 2px solid #007bff; padding: 10px; border-radius: 8px; cursor: pointer;"
                        onclick="saveData('Preset Image ${index + 1} Selected')">
                        <img src="/POC/image_croppie/icon/${index + 1}.png" alt="Preset ${index + 1}"
                            style="width: 130px; height: auto; object-fit: cover; border-radius: 8px" />
                        <div>Preset ${index + 1}</div>
                </div>
            `;
        }

    }
    function ImageUploadBtn(params) {
        // alert("Image Upload Clicked");
        document.getElementById('preset-upload-btn').classList.remove('active');
        document.getElementById('preset-upload-btn').setAttribute('aria-pressed', 'false');
        document.getElementById('image-upload-btn').classList.add('active');
        document.getElementById('image-upload-btn').setAttribute('aria-pressed', 'true');
        document.getElementById('image-upload').style.display = "block";
        document.getElementById('preset-upload').style.display = "none";
    }
    document.getElementById('image-upload-btn').addEventListener('click', ImageUploadBtn);
    document.getElementById('preset-upload-btn').addEventListener('click', PresetUploadBtn);
</script>

</html>
